name: Android con ffmpeg incluido

# Workflow APARTE y manual: no toca build.yml. Compila ffmpeg para Android (se cachea), compila el APK con Flet
# y le inyecta libffmpeg.so. Resultado: ForgeCut-android-arm64-ffmpeg.apk
on:
  workflow_dispatch: {}

env:
  PYTHON_VERSION: "3.12"
  FLET_VERSION: "0.86.0"
  PYTHONUTF8: "1"

jobs:
  ffmpeg:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: out/libffmpeg.so
          key: ffmpeg-android-arm64-n7.1-x264-lame-v1
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update && sudo apt-get install -y nasm pkg-config make
          bash scripts/android/build_ffmpeg.sh
      - uses: actions/upload-artifact@v4
        with: { name: libffmpeg-arm64, path: out/libffmpeg.so }

  apk:
    needs: ffmpeg
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/cache@v4
        with: { path: ~/flutter, key: "flutter-${{ runner.os }}-${{ env.FLET_VERSION }}" }
      - uses: actions/download-artifact@v4
        with: { name: libffmpeg-arm64, path: ffmpeg_in }
      # Un único «flet build apk» NORMAL: un script init de Gradle (aplica a cualquier build de la máquina) añade
      # libffmpeg.so a jniLibs y fuerza la EXTRACCIÓN de librerías nativas (useLegacyPackaging). Sin extracción Android
      # deja el .so dentro del APK y no se puede ejecutar -> la app dice «sin ffmpeg».
      - name: Preparar Gradle (jniLibs + extracción de librerías)
        run: |
          mkdir -p "$GITHUB_WORKSPACE/ffmpeg_jni/arm64-v8a" "$HOME/.gradle/init.d"
          cp ffmpeg_in/libffmpeg.so "$GITHUB_WORKSPACE/ffmpeg_jni/arm64-v8a/libffmpeg.so"
          echo "FORGECUT_JNILIBS=$GITHUB_WORKSPACE/ffmpeg_jni" >> "$GITHUB_ENV"
          cat > "$HOME/.gradle/init.d/forgecut.gradle" <<'EOF'
          allprojects {
            afterEvaluate { p ->
              def a = p.extensions.findByName('android')
              if (a != null && p.plugins.hasPlugin('com.android.application')) {
                def pk = a.hasProperty('packaging') ? a.packaging : a.packagingOptions
                pk.jniLibs.useLegacyPackaging = true
                def d = System.getenv('FORGECUT_JNILIBS')
                if (d) { a.sourceSets.getByName('main').jniLibs.srcDir(d) }
                println "FORGECUT: useLegacyPackaging=true, jniLibs=" + d
              }
            }
          }
          EOF
      - run: pip install "flet==${{ env.FLET_VERSION }}"
      - name: Añadir flet-audio (SOLO Android; Windows no cambia)
        run: |
          sed -i 's/dependencies = \["flet==${{ env.FLET_VERSION }}"\]/dependencies = ["flet==${{ env.FLET_VERSION }}", "flet-audio==${{ env.FLET_VERSION }}"]/' pyproject.toml
          echo "flet-audio==${{ env.FLET_VERSION }}" >> requirements.txt
          grep -n "flet-audio" pyproject.toml requirements.txt
      - run: flet build apk --yes --split-per-abi --build-number ${{ github.run_number }} --verbose
      - name: Verificar (libffmpeg.so dentro + extracción activada)
        run: |
          APK="$(ls build/apk/*arm64-v8a*.apk | head -1)"; echo "APK: $APK"
          unzip -l "$APK" | grep libffmpeg
          BT="$(ls -d "${ANDROID_HOME:-$ANDROID_SDK_ROOT}"/build-tools/* | sort -V | tail -1)"
          "$BT/aapt2" dump xmltree --file AndroidManifest.xml "$APK" | grep -i extractNativeLibs
          cp "$APK" ForgeCut-android-arm64-ffmpeg.apk
      - uses: actions/upload-artifact@v4
        with: { name: forgecut-android-arm64-ffmpeg, path: ForgeCut-android-arm64-ffmpeg.apk }
